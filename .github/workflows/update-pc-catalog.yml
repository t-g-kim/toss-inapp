name: Automatic PC Parts Catalog & Price Sync

on:
  schedule:
    # 매주 월요일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Catalog & Price Updater
        run: node --loader tsx apps/make-my-pc/scripts/update-catalog.ts || npm run build

      - name: Commit and push if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "PC Catalog Sync Bot"
          if [ -n "$(git status --porcelain apps/make-my-pc/catalog-latest.json)" ]; then
            git add apps/make-my-pc/catalog-latest.json
            git commit -m "chore(make-my-pc): auto-sync latest PC parts & market prices [skip ci]"
            git push origin main
          else
            echo "No price updates required."
          fi
