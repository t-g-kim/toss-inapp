name: Automatic PC Parts Catalog & Price Sync

on:
  schedule:
    # 매주 월요일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Catalog & Price Updater (Danawa + Coupang)
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: npx tsx apps/make-my-pc/scripts/update-catalog.ts

      - name: Commit and push if updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/make-my-pc/catalog-latest.json
          if git diff --staged --quiet; then
            echo "✅ No price updates or changes detected in catalog-latest.json."
          else
            echo "📦 Changes detected. Committing latest catalog..."
            git commit -m "chore(make-my-pc): auto-sync latest PC parts & market prices [skip ci]"
            echo "🔄 Re-syncing with remote main branch..."
            git pull --rebase origin main || true
            echo "🚀 Pushing catalog update to origin main..."
            git push origin HEAD:main
            echo "🎉 Successfully pushed latest PC catalog!"
          fi


