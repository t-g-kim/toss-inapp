name: Automatic PC Parts Catalog & Price Sync

on:
  schedule:
    # 매 8시간마다 자동 실행 (UTC 00:00, 08:00, 16:00 = KST 09:00, 17:00, 01:00)
    - cron: '0 */8 * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Catalog & Price Updater (Danawa + Coupang)
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: npx tsx apps/make-my-pc/scripts/update-catalog.ts

      - name: Commit and push if updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 원격 최신 변경사항 사전 동기화
          git fetch origin main
          git rebase origin/main || true

          # 2. 업데이트된 카탈로그 스테이징
          git add apps/make-my-pc/catalog-latest.json

          # 3. 변경사항이 있는 경우에만 커밋 & 안전 푸시
          if git diff --staged --quiet; then
            echo "✅ No price updates or changes detected in catalog-latest.json."
          else
            echo "📦 Changes detected. Committing latest catalog..."
            git commit -m "chore(make-my-pc): auto-sync latest PC parts & market prices [skip ci]"
            
            echo "🚀 Pushing catalog update to origin main with auto-rebase protection..."
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "🎉 Successfully pushed latest PC catalog on attempt $attempt!"
                break
              else
                echo "⚠️ Push rejected on attempt $attempt. Re-fetching and rebasing with latest catalog..."
                git fetch origin main
                git rebase -X theirs origin/main || true
              fi
            done
          fi



